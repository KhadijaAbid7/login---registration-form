<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login & Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- full webpage -->

    <div class="webpage">

    <!-- form box -->

      <div class="form-box">
        
        <!-- top button -->
         
         <div class="button-box">
            <div id="btn" ></div>
            <button type="button" class="toggle-button" onclick="login()">Log In</button>
            <button type="button" class="toggle-button" onclick="register()">Register</button>
         </div>

          <!-- social icons -->

         <div class="social-icons">
           <img src="fb.png">
           <img src="tw.png">
           <img src="gp.png">
         </div>

       <!-- input form -->

        <form id="login" class="input-group">
          <input type="text" class="input-field" placeholder="Username" required>
          <input type="password" class="input-field" placeholder="Password" required>
          <input type="checkbox" class="checkbox"> <span> Remember Password</span>
          <button type="submit" class="submit-button">Log In</button>
        </form>

        <!-- registration form -->

        <form id="register" class="input-group">
          <input type="text" class="input-field" placeholder="Username" required>
          <input type="email" class="input-field" placeholder="email" required>
          <input type="checkbox" class="checkbox"> <span>I agree to the terms & conditions</span>
          <button type="submit" class="submit-button">Register</button>
        </form>
    
      </div>

    </div>
     
    <!-- Javascript -->
<script>
  var x = document.getElementById("login");
  var y = document.getElementById("register");
  var z = document.getElementById("btn");

  function register(){
      x.style.left = "-400px";
      y.style.left = "50px";
      z.style.left = "110px";
  }
  
  function login(){
      x.style.left = "50px";
      y.style.left = "450px";
      z.style.left = "110px";
  }
</script>

</body>
</html>
